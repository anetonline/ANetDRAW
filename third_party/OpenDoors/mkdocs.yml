site_name: OpenDoors Reference
site_description: Current reference documentation for the OpenDoors C/C++ toolkit
site_url: https://realdeuce.github.io/OpenDoors/
repo_url: https://github.com/RealDeuce/OpenDoors
repo_name: RealDeuce/OpenDoors
edit_uri: edit/master/docs/

theme:
  name: material
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Introduction: introduction.md
  - Getting started: getting-started.md
  - Guides:
      - Programming tutorial: guides/programming-tutorial.md
      - Building and linking: guides/building.md
      - Session lifecycle: guides/session-lifecycle.md
      - Terminal and screen model: guides/terminal-screen.md
      - Windows programming: guides/windows.md
      - DOS personalities: guides/personalities.md
      - Configuration and command lines: guides/configuration.md
      - Custom door-information formats: guides/door-information-formats.md
      - Log-file system: guides/logging.md
      - Multi-node operation: guides/multinode.md
      - Troubleshooting: guides/troubleshooting.md
      - Versioning and compatibility: guides/versioning.md
  - API reference:
